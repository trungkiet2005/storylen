name: Smoke Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL of deployed server to smoke-test"
        required: true
        default: "http://localhost:8000"

jobs:
  smoke:
    name: Smoke test against ${{ github.event.inputs.target_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for server
        run: |
          URL="${{ github.event.inputs.target_url }}"
          for i in $(seq 1 20); do
            if curl -sf "${URL}/health/live" > /dev/null 2>&1; then
              echo "Server ready."
              break
            fi
            echo "Waiting… ($i)"
            sleep 5
          done

      - name: Health live
        run: |
          STATUS=$(curl -sf "${{ github.event.inputs.target_url }}/health/live" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'])")
          echo "Status: $STATUS"
          [ "$STATUS" = "ok" ] || exit 1

      - name: Health ready
        run: |
          curl -sf "${{ github.event.inputs.target_url }}/health/ready" | python3 -c "import sys,json; json.load(sys.stdin); print('Ready OK')"

      - name: List manga (empty OK)
        run: |
          curl -sf "${{ github.event.inputs.target_url }}/api/v1/manga" | python3 -c "import sys,json; data=json.load(sys.stdin); assert isinstance(data, list); print(f'Manga list OK ({len(data)} items)')"
