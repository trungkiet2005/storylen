<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StoryLens — Manga Translation Pipeline</title>
    <meta
      name="description"
      content="AI-powered manga translation: Gemini + Multi-RAG + LLMOps"
    />

    <!-- Design system -->
    <link rel="stylesheet" href="/static/style.css" />

    <!-- Favicon (emoji) -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>"
    />
  </head>
  <body>
    <div id="app">
      <!-- Sidebar -->
      <aside id="sidebar">
        <div class="sidebar-logo">
          <div class="sidebar-logo-icon">📖</div>
          <div>
            <div class="sidebar-logo-text">StoryLens</div>
            <div class="sidebar-logo-sub">Manga AI Demo</div>
          </div>
        </div>
        <nav id="nav-container"></nav>
        <div class="sidebar-footer">
          <div class="sidebar-key-status">
            <div class="key-dot" id="key-dot"></div>
            <span id="key-status-text">Checking…</span>
          </div>
        </div>
      </aside>

      <!-- Main -->
      <main id="main">
        <div style="padding: 48px; text-align: center; color: var(--text-3)">
          Initializing…
        </div>
      </main>
    </div>

    <!-- Components -->
    <script src="/static/components/nav.js?v=3"></script>
    <script src="/static/components/toast.js?v=2"></script>
    <script src="/static/components/progress-bar.js?v=2"></script>
    <script src="/static/components/job-card.js?v=2"></script>

    <script src="/static/pages/admin-home.js?v=2"></script>
    <script src="/static/pages/admin-users.js?v=1"></script>
    <script src="/static/pages/admin.js?v=4"></script>
    <script src="/static/pages/profile.js?v=1"></script>
    <script src="/static/pages/import.js?v=2"></script>
    <script src="/static/pages/studio.js?v=2"></script>
    <script src="/static/pages/review.js?v=2"></script>
    <script src="/static/pages/library.js?v=11"></script>
    <script src="/static/pages/reader.js?v=12"></script>
    <script src="/static/pages/summary.js?v=2"></script>

    <!-- App router (must load last) -->
    <script src="/static/app.js?v=3"></script>


    <script>
      // Render sidebar nav
      document.getElementById("nav-container").innerHTML = Nav.render(
        "home",
        () => {},
