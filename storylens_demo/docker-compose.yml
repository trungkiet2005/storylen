services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override key via Docker secret or env var (NOT secrets/keys.json in container)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./artifacts:/app/artifacts
      - ./chromadb:/app/chromadb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
