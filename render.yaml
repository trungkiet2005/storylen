# render.yaml — Infrastructure-as-code for Render.com
# Docs: https://render.com/docs/blueprint-spec
# Architecture: Render = lightweight API Gateway | HuggingFace Space = AI Worker

services:
  - type: web
    name: storylens-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free           # $0/mo — 512 MB RAM, sleeps after 15 min inactivity (cold start ~30–60s)
    region: singapore    # closest to Vietnam
    branch: main
    autoDeploy: true

    # NOTE: Render free tier does NOT support preDeployCommand. Apply Supabase
    # migrations manually before pushing schema changes:
    #   python -m app.scripts.apply_migrations
    # All migrations are idempotent (IF NOT EXISTS), so re-running is safe.
    # Upgrade to Starter ($7/mo) to re-enable an automated pre-deploy hook.

    envVars:
      # ─── Supabase ──────────────────────────────────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Required by apply_migrations script. Format:
      # postgresql://postgres.<ref>:<pwd>@aws-0-<region>.pooler.supabase.com:6543/postgres
      - key: SUPABASE_DB_URL
        sync: false

      # ─── Gemini ────────────────────────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false

      # ─── ai_module (Image Translation Worker on HuggingFace Space) ─────
      - key: AI_MODULE_URL
        sync: false    # e.g. https://huynhtrungkiet09032005-ai-storylen.hf.space
      - key: AI_MODULE_TOKEN
        sync: false    # optional: HF read token if Space is private

      # ─── Multi-replica state (optional) ────────────────────────────────
      # When set, pipeline cancellation, event-bus replay, and rate-limit
      # storage move from in-process dicts to Redis. Leave empty for free tier.
      - key: REDIS_URL
        sync: false

      # ─── Stripe (optional — leave empty to disable checkout) ──────────
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_BASIC
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false

      # ─── App ───────────────────────────────────────────────────────────
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "https://storylen.vercel.app,https://storylens.vercel.app,http://localhost:3000"
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"

    healthCheckPath: /health
