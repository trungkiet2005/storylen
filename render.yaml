# render.yaml — Infrastructure-as-code for Render.com
# Docs: https://render.com/docs/blueprint-spec
# Architecture: Render = lightweight API Gateway | HuggingFace Space = AI Worker

services:
  - type: web
    name: storylens-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free           # $0/mo — 512 MB RAM, sleeps after 15 min inactivity (cold start ~30–60s)
    region: singapore    # closest to Vietnam
    branch: main
    autoDeploy: true

    envVars:
      # ─── Supabase ──────────────────────────────────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      # ─── Gemini ────────────────────────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false

      # ─── ai_module (Image Translation Worker on HuggingFace Space) ─────
      - key: AI_MODULE_URL
        sync: false    # e.g. https://huynhtrungkiet09032005-ai-storylen.hf.space
      - key: AI_MODULE_TOKEN
        sync: false    # optional: HF read token if Space is private

      # ─── App ───────────────────────────────────────────────────────────
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "https://storylen.vercel.app,https://storylens.vercel.app,http://localhost:3000"
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"

    healthCheckPath: /health
